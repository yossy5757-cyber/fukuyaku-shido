<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>服薬指導ポイント帳</title>
<style>
:root{
  --ink:#1d2433; --sub:#5d6677; --line:#e3e7ee; --bg:#f6f8fb; --card:#fff;
  --blue:#1f5fa8; --blue-l:#e8f0fa; --red:#c62828; --red-l:#fdecec;
  --amber:#8a5a00; --amber-l:#fff6e0; --purple:#6a3fa0; --purple-l:#f1ebfa;
  --green:#2e7d32; --gray-l:#eef1f5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 14px 8px}
.top{display:flex;align-items:center;gap:8px;max-width:860px;margin:0 auto}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.top .ver{font-size:11px;color:var(--sub)}
.top .info{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:3px 11px;font-size:13px;cursor:pointer;color:var(--sub)}
.search{max-width:860px;margin:8px auto 0;position:relative}
.search input{width:100%;font-size:16px;padding:10px 38px 10px 12px;border:1.5px solid #cfd6e1;
  border-radius:10px;outline:none;background:#fff}
.search input:focus{border-color:var(--blue)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
  font-size:20px;color:#99a;cursor:pointer;padding:2px 8px;display:none}
.chips{max-width:860px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #cfd6e1;background:#fff;border-radius:999px;padding:4px 12px;
  font-size:13px;cursor:pointer;white-space:nowrap;color:var(--sub)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.hr.on{background:var(--red);border-color:var(--red)}
.sep{flex:none;width:1px;background:var(--line);margin:3px 2px}
main{max-width:860px;margin:0 auto;padding:10px 12px 60px}
.hint{color:var(--sub);font-size:13px;margin:4px 2px 10px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:8px;font-weight:700}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .n{margin-left:auto;font-weight:400;font-size:12px;color:var(--sub)}
.grp>summary:after{content:"›";font-size:20px;color:#9aa3b2;transform:rotate(90deg);transition:.15s;margin-left:4px}
.grp[open]>summary:after{transform:rotate(-90deg)}
.grp .rows{border-top:1px solid var(--line)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:block;width:100%;text-align:left;border:0;background:#fff;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:#fafcff}
.row .nm{font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.row .more{font-weight:400;font-size:12px;color:var(--sub)}
.row .ing{font-size:12px;color:var(--sub)}
.row .kp{font-size:13px;color:#33405a;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.dim .nm{font-weight:500;color:#45506a}
.bd{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;line-height:18px;white-space:nowrap}
.bd.hr{background:var(--red-l);color:var(--red)}
.bd.my{background:var(--purple-l);color:var(--purple)}
.bd.si{background:var(--blue-l);color:var(--blue)}
.bd.rt{background:var(--gray-l);color:var(--sub);font-weight:500}
.bd.none{background:#e9f5ea;color:var(--green)}
.bd.na,.bd.pending{background:var(--gray-l);color:#7a8496;font-weight:500}
.bd.stop{background:#fff0e6;color:#b24a00}
.stat{font-size:12px;color:var(--sub);margin:14px 4px 0;line-height:1.8}
.empty{padding:28px 10px;text-align:center;color:var(--sub)}
/* 詳細 */
#dv{position:fixed;inset:0;z-index:20;background:rgba(20,28,45,.35);display:none}
#dv.open{display:block}
.sheet{position:absolute;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:760px){
  .sheet{inset:24px auto 24px 50%;transform:translateX(-50%);width:720px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
}
.sh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px;z-index:2}
.sh .back{border:0;background:none;font-size:15px;color:var(--blue);cursor:pointer;padding:4px 6px}
.sh .t{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sh .cp{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer}
.sb{padding:14px 14px 40px}
.ttl{font-size:19px;font-weight:700;line-height:1.45;margin:0 0 4px}
.meta{font-size:13px;color:var(--sub);margin-bottom:8px}
.bds{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.prods{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:12px;font-size:13px}
.prods div{padding:3px 0;border-bottom:1px dashed var(--line)}
.prods div:last-child{border-bottom:0}
.prods .sp{color:var(--sub);font-size:12px}
.key{background:var(--amber-l);border:1px solid #f0d9a6;border-left:5px solid #e0a400;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.key .lb{font-size:12px;font-weight:700;color:var(--amber);margin-bottom:2px}
.key .tx{font-size:15px;font-weight:600}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.sec h3{margin:0 0 4px;font-size:15px;color:var(--blue)}
.sec ul{margin:0;padding-left:1.2em}
.sec li{margin:3px 0}
.sec strong,.key strong,.row strong{color:var(--red);font-weight:700}
.clsbox{border:1px dashed #b9c6da;border-radius:12px;padding:10px 10px 2px;margin:14px 0 10px;background:#fbfcfe}
.clsbox .cl{font-size:13px;font-weight:700;color:var(--sub);margin:0 4px 8px}
.clsbox .sec{background:#fff}
.nb{font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:#33405a}
.foot{font-size:12px;color:var(--sub);margin-top:16px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#263248;color:#fff;
  padding:8px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.about h2{font-size:16px;margin:4px 0 8px}
.about p,.about li{font-size:14px}
.about ul{padding-left:1.2em}
@media print{header,.sh .back,.sh .cp{display:none}#dv{position:static;background:none}.sheet{position:static;box-shadow:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>服薬指導ポイント帳</h1>
    <span class="ver" id="ver"></span>
    <button class="info" id="infoBtn">使い方</button>
  </div>
  <div class="search">
    <input id="q" type="text" placeholder="薬品名・成分名で検索（ひらがな可）" autocomplete="off" enterkeyhint="search">
    <button class="clr" id="clr" aria-label="クリア">×</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip on" data-r="">すべて</button>
    <button class="chip" data-r="内服">内服</button>
    <button class="chip" data-r="外用">外用</button>
    <button class="chip" data-r="自己注射">自己注射</button>
    <span class="sep"></span>
    <button class="chip hr" data-f="hr">ハイリスク</button>
    <button class="chip" data-f="done">ポイントあり</button>
  </div>
</header>
<main id="main"></main>
<div id="dv"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

const ITEMS = DATA.items, CLS = DATA.classes;
const GROUP_ORDER = ['抗凝固・抗血小板','糖尿病','抗てんかん','不整脈・強心','免疫抑制・抗リウマチ','精神神経','抗がん剤','麻薬・鎮痛','自己注射','ステロイド','抗感染症（要注意）','骨粗鬆症・その他','睡眠薬・抗不安薬','降圧薬・利尿薬','吸入薬','点眼薬','漢方','外用'];
const ST_LABEL = {done:'', none:'特記なし', na:'対象外', pending:'未作成'};
const ST_RANK = {done:0, none:1, pending:2, na:3};
const state = {q:'', route:'', hr:false, done:false};

// ---------- 文字列処理 ----------
function norm(s){
  return (s||'').normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/[\s・･「」『』()（）\[\]【】\-－‐―]/g,'');
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function plain(s){return (s||'').replace(/\*\*/g,'');}
ITEMS.forEach(it=>{
  it._s = norm([it.ing, it.yakko, it.c87, ...(it.al||[]).map(a=>a.replace(/^~/,'')), ...it.p.map(p=>p.n+' '+p.g)].join(' '));
  it._name = it.p[0].n;
});
const BY_ID = Object.fromEntries(ITEMS.map(i=>[i.id,i]));

// ---------- 一覧 ----------
function badges(it, withRoute){
  let h='';
  if(it.hr) h+='<span class="bd hr">ハイリスク</span>';
  if(it.mayaku) h+='<span class="bd my">麻薬</span>';
  if(it.route==='自己注射') h+='<span class="bd si">自己注射</span>';
  else if(withRoute) h+=`<span class="bd rt">${it.route}</span>`;
  if(it.st!=='done') h+=`<span class="bd ${it.st}">${ST_LABEL[it.st]}</span>`;
  if(it.p.some(p=>p.x)) h+='<span class="bd stop">販売中止予定</span>';
  return h;
}
function rowHTML(it){
  const more = it.p.length>1 ? `<span class="more">ほか${it.p.length-1}規格</span>` : '';
  const kp = it.key ? `<div class="kp">${md(it.key)}</div>` : '';
  return `<button class="row${it.st==='done'?'':' dim'}" data-id="${it.id}">
    <div class="nm">${esc(it._name)}${more}${badges(it,true)}</div>
    <div class="ing">${esc(it.ing)}</div>${kp}</button>`;
}
function filtered(){
  const q = norm(state.q);
  return ITEMS.filter(it=>{
    if(state.route && it.route!==state.route) return false;
    if(state.hr && !it.hr) return false;
    if(state.done && it.st!=='done') return false;
    if(q && !it._s.includes(q)) return false;
    return true;
  });
}
function render(){
  const m = document.getElementById('main');
  document.getElementById('clr').style.display = state.q ? 'block':'none';
  const browsing = !state.q && !state.route && !state.hr && !state.done;
  if(browsing){ m.innerHTML = groupView(); return; }
  let list = filtered();
  list.sort((a,b)=> ST_RANK[a.st]-ST_RANK[b.st] || (b.hr-a.hr) || a._name.localeCompare(b._name,'ja'));
  if(!list.length){ m.innerHTML = '<div class="empty">該当する採用薬がありません</div>'; return; }
  const cap = 300;
  m.innerHTML = `<div class="hint">${list.length}件${list.length>cap?`（先頭${cap}件を表示）`:''}</div>
    <div class="list">${list.slice(0,cap).map(rowHTML).join('')}</div>`;
}
function groupView(){
  const g = {};
  ITEMS.filter(i=>i.st==='done').forEach(i=>{(g[i.grp||'その他']=g[i.grp||'その他']||[]).push(i);});
  const keys = [...GROUP_ORDER.filter(k=>g[k]), ...Object.keys(g).filter(k=>!GROUP_ORDER.includes(k))];
  const c = {done:0,none:0,na:0,pending:0}; ITEMS.forEach(i=>c[i.st]++);
  return `<div class="hint">薬品名で検索するか、分類から選んでください。</div>` +
    keys.map(k=>{
      const arr = g[k].sort((a,b)=>a._name.localeCompare(b._name,'ja'));
      return `<details class="grp"><summary>${esc(k)}<span class="n">${arr.length}成分</span></summary>
        <div class="rows">${arr.map(rowHTML).join('')}</div></details>`;
    }).join('') +
    `<div class="stat">収載：ポイントあり ${c.done}／特記なし ${c.none}／未作成 ${c.pending}／対象外 ${c.na}（成分×剤形）<br>
     「未作成」の薬も検索すると採用規格は表示されます。</div>`;
}

// ---------- 詳細 ----------
function secHTML(s){
  return `<div class="sec">${s.h?`<h3>${esc(s.h)}</h3>`:''}<ul>${s.items.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>`;
}
function detailHTML(it){
  const prods = it.p.map(p=>`<div>${esc(p.n)} <span class="sp">${esc(p.s)}｜${esc(p.m)}${p.k?'｜'+esc(p.k):''}${p.r?'｜'+esc(p.r):''}${p.x?'｜<b style="color:#b24a00">販売中止予定 '+esc(p.x)+'</b>':''}</span></div>`).join('');
  let body = '';
  if(it.key) body += `<div class="key"><div class="lb">ここだけは</div><div class="tx">${md(it.key)}</div></div>`;
  body += it.secs.map(secHTML).join('');
  it.cls.forEach(cid=>{
    const c = CLS[cid]; if(!c) return;
    body += `<div class="clsbox"><div class="cl">${esc(c.name.endsWith('共通')?c.name:'共通：'+c.name)}</div>${c.secs.map(secHTML).join('')}</div>`;
  });
  if(it.st==='none') body += `<div class="nb">特に注意すべき点はありません。一般的な説明（用法・用量、気になる症状があれば相談）で十分です。</div>`;
  if(it.st==='na') body += `<div class="nb">服薬指導の対象外としています（院内使用・検査用・調剤用など）。</div>`;
  if(it.st==='pending') body += `<div class="nb">この薬の服薬指導ポイントはまだ作成していません（第2弾以降で作成予定）。電子添文・患者向医薬品ガイド等で確認してください。</div>`;
  const foot = (it.st==='done'||it.secs.length) ?
    `<div class="foot">※ AIで作成した下書きで、薬剤師による確認前の内容です。最終的な判断は最新の電子添文で確認してください。</div>` : '';
  return `<div class="sh"><button class="back" id="back">‹ 戻る</button><div class="t">${esc(it._name)}</div>
      ${(it.st==='done'||it.secs.length)?'<button class="cp" id="cp">コピー</button>':''}</div>
    <div class="sb">
      <h2 class="ttl">${esc(it.ing)}</h2>
      <div class="meta">${esc(it.yakko)}${(it.al||[]).filter(a=>a[0]!=='~').length?'｜先発品名など：'+esc(it.al.filter(a=>a[0]!=='~').join('、')):''}</div>
      <div class="bds">${badges(it,true)}</div>
      <div class="prods">${prods}</div>
      ${body}${foot}
    </div>`;
}
function copyText(it){
  const head = `■ ${plain(it.ing)}（${it._name}）の服薬指導ポイント`;
  const L = [head];
  if(it.key) L.push('【ここだけは】'+plain(it.key));
  const secs = [...it.secs]; it.cls.forEach(c=>CLS[c]&&secs.push(...CLS[c].secs));
  // 同じ見出しはまとめる
  const merged = []; const idx = {};
  secs.forEach(s=>{ if(idx[s.h]!==undefined) merged[idx[s.h]].items.push(...s.items); else {idx[s.h]=merged.length; merged.push({h:s.h,items:[...s.items]});} });
  merged.forEach((s,i)=>{ L.push(`${i+1}．${s.h}`); s.items.forEach(x=>L.push('・'+plain(x))); });
  return L.join('\n');
}
function openDetail(id, push){
  const it = BY_ID[id]; if(!it) return;
  const dv = document.getElementById('dv'), sh = document.getElementById('sheet');
  sh.innerHTML = detailHTML(it); sh.scrollTop = 0;
  dv.classList.add('open'); document.body.style.overflow='hidden';
  if(push) history.pushState({d:id}, '', '#'+id);
  document.getElementById('back').onclick = ()=>history.back();
  const cp = document.getElementById('cp');
  if(cp) cp.onclick = ()=>copy(copyText(it));
}
function closeDetail(){
  document.getElementById('dv').classList.remove('open'); document.body.style.overflow='';
}
function showAbout(push){
  const c = {done:0,none:0,na:0,pending:0}; ITEMS.forEach(i=>c[i.st]++);
  const sh = document.getElementById('sheet');
  sh.innerHTML = `<div class="sh"><button class="back" id="back">‹ 戻る</button><div class="t">使い方</div></div>
  <div class="sb about">
    <h2>服薬指導ポイント帳</h2>
    <p>当院の採用薬について、服薬指導の前にさっと確認するための薬剤師向けメモです。注意点が少ない薬は無理に書かず「特記なし」としています。</p>
    <ul>
      <li><b>検索</b>：商品名・成分名・一般名・薬効で検索できます（ひらがな・カタカナどちらでも可）。</li>
      <li><b>ここだけは</b>：その薬で一番伝えるべきこと。</li>
      <li><b>共通</b>：同じ薬効群に共通する注意（例：DOAC共通、SGLT2阻害薬共通）。</li>
      <li><b>コピー</b>：内容を文字でコピーし、指導記録などに貼り付けられます。</li>
      <li><b>ハイリスク</b>：特定薬剤管理指導加算の対象となる薬効群を目安に表示しています。</li>
    </ul>
    <h2>表示の意味</h2>
    <ul>
      <li>ポイントあり（${c.done}）：服薬指導ポイントを作成済み</li>
      <li>特記なし（${c.none}）：一般的な説明で十分な薬</li>
      <li>未作成（${c.pending}）：第2弾以降で作成予定</li>
      <li>対象外（${c.na}）：院内使用・検査用・調剤用など</li>
    </ul>
    <h2>ご注意</h2>
    <p>内容はAIが作成した下書きで、薬剤師による確認前の版です。用量・併用禁忌などの最終判断は、必ず最新の電子添文で確認してください。</p>
    <p class="foot">採用薬リスト：${esc(DATA.listDate)}出力分／作成：${esc(DATA.built)}<br>対象：内服・外用の全採用薬、注射は自己注射薬のみ。</p>
  </div>`;
  document.getElementById('dv').classList.add('open'); document.body.style.overflow='hidden'; sh.scrollTop=0;
  if(push) history.pushState({a:1}, '', '#about');
  document.getElementById('back').onclick = ()=>history.back();
}
function copy(text){
  const done = ()=>toast('コピーしました');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, ()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('コピーできませんでした'); }
    ta.remove();
  }
}
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 1600);
}

// ---------- イベント ----------
document.getElementById('ver').textContent = DATA.listDate ? `採用薬 ${DATA.listDate}版` : '';
const q = document.getElementById('q');
let tm; q.addEventListener('input', ()=>{ clearTimeout(tm); tm=setTimeout(()=>{state.q=q.value; render();}, 120); });
document.getElementById('clr').onclick = ()=>{ q.value=''; state.q=''; render(); q.focus(); };
document.getElementById('chips').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  if(b.dataset.r!==undefined){
    state.route = b.dataset.r;
    document.querySelectorAll('.chip[data-r]').forEach(x=>x.classList.toggle('on', x===b));
  } else {
    const f = b.dataset.f; state[f] = !state[f]; b.classList.toggle('on', state[f]);
  }
  render();
});
document.getElementById('main').addEventListener('click', e=>{
  const r = e.target.closest('.row'); if(r) openDetail(r.dataset.id, true);
});
document.getElementById('infoBtn').onclick = ()=>showAbout(true);
document.getElementById('dv').addEventListener('click', e=>{ if(e.target.id==='dv') history.back(); });
window.addEventListener('popstate', ()=>{
  const h = location.hash.slice(1);
  if(h==='about') showAbout(false); else if(BY_ID[h]) openDetail(h,false); else closeDetail();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('dv').classList.contains('open')) history.back();
  if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); }
});
render();
if(location.hash){ const h=location.hash.slice(1); if(BY_ID[h]) openDetail(h,false); else if(h==='about') showAbout(false); }
</script>
</body>
</html>
